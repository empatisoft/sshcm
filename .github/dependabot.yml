# Weekly pull requests for Rust dependency updates, grouped into one.
#
# GitHub Actions are not listed on purpose: release.yml is generated by dist
# and must match `dist generate`, so its actions are updated by upgrading
# dist, not by editing the file.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
