[package]
name = "sshcm"
description = "SSH Connection Manager: add, edit, remove and list the connections in ~/.ssh/config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
inquire = { version = "0.9.5", default-features = false, features = ["crossterm", "fuzzy"] }
serde = { version = "1.0.229", features = ["derive"] }
sshcm-core = { path = "../sshcm-core", version = "0.2.0" }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
