[package]
name = "sshcm"
description = "SSH Connection Manager: add, edit, remove and list the connections in ~/.ssh/config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
inquire = { version = "0.9.5", default-features = false, features = ["crossterm", "fuzzy"] }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sshcm-core.workspace = true
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
